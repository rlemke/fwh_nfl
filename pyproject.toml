[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fwh-nfl"
version = "0.1.0"
description = "Facetwork domain: NFL players, teams and game predictions — nflverse data, an Elo team rating scored against the betting line, and a Monte Carlo path to the Super Bowl"
requires-python = ">=3.11"
authors = [{name = "Ralph Lemke"}]
dependencies = ["pymongo>=4.0", "jinja2>=3.0"]

[project.optional-dependencies]
test = ["pytest>=7.0", "mongomock>=4.1"]

[project.entry-points."facetwork.domains"]
nfl = "nfl:domain"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nfl = ["ffl/*.ffl", "site/templates/*.html"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "B905"]
